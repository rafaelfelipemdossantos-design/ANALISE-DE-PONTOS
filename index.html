<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analisador de Auditorias</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Analisador">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#f1f5f9;color:#334155}
header{background:#0f172a;color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}.btn{background:#2563eb;color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}.btn.g{background:#334155}
nav{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}nav button{border:0;background:#e2e8f0;padding:10px 16px;border-radius:10px 10px 0 0;font-weight:700;cursor:pointer;color:#475569}nav button.on{background:#fff;color:#0f172a}
main{background:#fff;margin:0 20px 20px;padding:20px;border-radius:0 12px 12px 12px;min-height:60vh}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}.k div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.k b{display:block;font-size:24px;color:#0f172a}.k span{font-size:11px;text-transform:uppercase;color:#94a3b8;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;text-transform:uppercase;color:#94a3b8;padding:8px;border-bottom:2px solid #e2e8f0}td{padding:9px 8px;border-bottom:1px solid #f1f5f9}tr[data-k]{cursor:pointer}tr[data-k]:hover{background:#f8fafc}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}.up{color:#16a34a;font-weight:800}.dn{color:#dc2626;font-weight:800}
h2{font-size:16px;margin:22px 0 10px;color:#0f172a}.box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px}.act{border-left:5px solid #2563eb}.act.r{border-color:#dc2626}.act.y{border-color:#eab308}
.bar{background:#e2e8f0;border-radius:99px;height:12px;overflow:hidden}.bar i{display:block;height:100%}.row{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.ch{width:100%;max-width:700px}.empty{text-align:center;color:#94a3b8;padding:60px 10px}.sm{font-size:12px;color:#94a3b8}.wrap{overflow-x:auto}select{padding:8px;border-radius:8px;border:1px solid #cbd5e1}
#drop{display:none;position:fixed;inset:0;background:#2563ebcc;color:#fff;font-size:24px;font-weight:800;align-items:center;justify-content:center;z-index:9}
@media print{header,nav,#fb{display:none}main{margin:0;padding:0}}
</style></head><body>
<div id="drop">Solte os relatórios aqui</div>
<header><h1>📈 Analisador de Auditorias</h1><div>
<label class="btn">+ Carregar relatórios<input type="file" id="f" multiple accept=".html,.htm,.json" hidden></label>
<button class="btn" id="sy">☁ Sincronizar</button> <button class="btn g" id="cf" title="Reconfigurar planilha">⚙</button> <button class="btn g" id="ex">Exportar base</button> <button class="btn g" id="cl">Limpar</button> <button class="btn" id="inst" hidden>⬇ Instalar app</button></div></header>
<nav id="nav"><button data-t="geral">Visão geral</button><button data-t="painel">Painel executivo</button><button data-t="loja">Evolução por loja</button><button data-t="acoes">Onde agir</button></nav>
<main id="v"></main>
<script>
const SEC={SOS:'SOS',CKO:'CKO/CKT',PE:'PE',KBDs:'KBDs'};
let DB=[],tab='geral',sel=null;
try{DB=JSON.parse(localStorage.getItem('aud')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('aud',JSON.stringify(DB))}catch(e){}};
const $=s=>document.querySelector(s),r1=n=>Math.round(n*10)/10,nk=s=>String(s).trim().toLowerCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=t=>new Date(t).toLocaleDateString('pt-BR'),pc=r=>r.max?r.got/r.max*100:0;
const cor=p=>p>=85?'#16a34a':p>=65?'#2563eb':p>=40?'#ca8a04':'#dc2626';

// ---------- leitura dos relatórios ----------
function parse(txt){
  const d=new DOMParser().parseFromString(txt,'text/html'),j=d.getElementById('audit-data');
  if(j){try{const o=JSON.parse(j.textContent);if(o&&o.loja&&o.ts)return o}catch(e){}}
  const info={};
  d.querySelectorAll('.info-item').forEach(e=>{const k=e.querySelector('strong');if(k)info[k.textContent.trim()]=e.textContent.replace(k.textContent,'').trim()});
  const sc=(d.querySelector('.score-value')||{}).textContent||'',nums=sc.match(/[\d.]+/g)||[];
  const m=(info['Data da Auditoria']||'').match(/(\d+)\/(\d+)\/(\d+)\D+(\d+):(\d+)/);
  if(!m||!info['Ponto de Venda (PDV)']||!nums.length)return null;
  const mc=(info['Modelo e Canal']||'').split('—').map(s=>s.trim()),itens=[],t={};
  d.querySelectorAll('ul.items').forEach((ul,i)=>ul.querySelectorAll('li:not(.empty)').forEach(li=>{
    const c=(li.querySelector('.cat')||{}).textContent||'',s=c.replace(/[\[\]\s]/g,'')==='CKO/CKT'?'CKO':c.replace(/[\[\]\s]/g,'');
    const w=i===0?parseFloat(((li.querySelector('.pts')||{}).textContent||'').replace(/[^\d.]/g,'')):null;
    itens.push({s,n:(li.querySelector('.name')||{}).textContent.trim(),w,r:i===0?1:0});
    if(i===0){t[s]=t[s]||{got:0,max:null};t[s].got+=w}
  }));
  return{loja:info['Ponto de Venda (PDV)'],promotor:info['Promotor de Vendas'],ts:new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).toISOString(),
    modelo:mc[0],canal:mc[1],got:parseFloat(nums[0]),max:parseFloat(nums[1]||0),status:(d.querySelector('.badge')||{}).textContent||'',t,itens,legado:1};
}
function add(r){
  const id=nk(r.loja)+'|'+r.ts+'|'+r.canal;
  if(DB.some(x=>x.id===id))return false;
  r.id=id;DB.push(r);return true;
}
async function ingest(files){
  let n=0,dup=0,bad=0;
  for(const f of files){
    const t=await f.text();
    if(/\.json$/i.test(f.name)){try{JSON.parse(t).forEach(r=>add(r)?n++:dup++)}catch(e){bad++}continue}
    const r=parse(t);if(!r)bad++;else if(add(r))n++;else dup++;
  }
  save();render();
  alert(n+' relatório(s) novo(s)'+(dup?', '+dup+' já existente(s)':'')+(bad?', '+bad+' não reconhecido(s)':'')+'.');
}

// ---------- análises ----------
const F={p:'',c:'',de:'',ate:''};
const view=()=>DB.filter(r=>(!F.p||r.promotor===F.p)&&(!F.c||r.canal===F.c)&&(!F.de||r.ts.slice(0,10)>=F.de)&&(!F.ate||r.ts.slice(0,10)<=F.ate));
function fbar(){
  const u=k=>[...new Set(DB.map(r=>r[k]).filter(Boolean))].sort();
  const o=(a,v)=>'<option value="">Todos</option>'+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
  return`<div class="box" id="fb" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">Promotor <select data-f="p">${o(u('promotor'),F.p)}</select> Canal <select data-f="c">${o(u('canal'),F.c)}</select> De <input type="date" data-f="de" value="${F.de}"> Até <input type="date" data-f="ate" value="${F.ate}"> <button class="btn g" data-csv>Baixar CSV</button> <button class="btn g" onclick="print()">Imprimir / PDF</button></div>`;
}
function csv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Loja','Promotor','Data','Modelo','Canal','Pontos','Máximo','%','Status'],...view().map(r=>[r.loja,r.promotor,dt(r.ts),r.modelo,r.canal,r.got,r.max,r1(pc(r)),r.status])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')],{type:'text/csv'}));a.download='auditorias.csv';a.click();
}
function lojas(){const m={};view().forEach(r=>(m[nk(r.loja)]=m[nk(r.loja)]||[]).push(r));for(const k in m)m[k].sort((a,b)=>a.ts<b.ts?-1:1);return m}
function pend(r){
  const out=[],ex=new Set(r.itens.filter(i=>i.x).map(i=>i.s));
  r.itens.forEach(i=>{if(i.r!==1&&!i.x)out.push({k:i.s+'|'+i.n,s:i.s,n:i.n,w:i.w||0})});
  ex.forEach(s=>{const t=r.t[s];if(t&&t.max>t.got)out.push({k:s+'|nivel',s,n:SEC[s]+': subir de nível (hoje '+r1(t.got)+' de '+r1(t.max)+')',w:r1(t.max-t.got)})});
  return out.sort((a,b)=>b.w-a.w);
}
const dlt=(h)=>h.length>1?pc(h.at(-1))-pc(h.at(-2)):null;
const fd=d=>d==null?'<span class="sm">1ª auditoria</span>':`<span class="${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${r1(Math.abs(d))} p.p.</span>`;

// ---------- telas ----------
function vGeral(){
  const L=lojas(),ks=Object.keys(L);
  const rows=ks.map(k=>({k,h:L[k],u:L[k].at(-1),d:dlt(L[k])})).sort((a,b)=>pc(a.u)-pc(b.u));
  const P={};view().forEach(r=>{const e=P[r.promotor]=P[r.promotor]||{n:0,s:0,l:new Set()};e.n++;e.s+=pc(r);e.l.add(nk(r.loja))});
  const pr=Object.entries(P).map(([n,e])=>({n,a:e.n,l:e.l.size,m:e.s/e.n})).sort((a,b)=>b.m-a.m);
  const med=rows.reduce((a,r)=>a+pc(r.u),0)/rows.length,queda=rows.filter(r=>r.d!=null&&r.d<0).length;
  return`<div class="k"><div><b>${ks.length}</b><span>Lojas</span></div><div><b>${DB.length}</b><span>Auditorias</span></div><div><b>${r1(med)}%</b><span>Média (última auditoria)</span></div><div><b>${queda}</b><span>Lojas em queda</span></div></div>
  <div class="wrap"><table><tr><th>Loja</th><th>Promotor</th><th>Última</th><th>Score</th><th>%</th><th>vs anterior</th><th>Aud.</th></tr>
  ${rows.map(r=>`<tr data-k="${esc(r.k)}"><td><b>${esc(r.u.loja)}</b><br><span class="sm">${esc(r.u.modelo||'')} ${esc(r.u.canal||'')}</span></td><td>${esc(r.u.promotor)}</td><td>${dt(r.u.ts)}</td><td>${r1(r.u.got)} / ${r1(r.u.max)}</td><td><span class="tag" style="background:${cor(pc(r.u))}">${r1(pc(r.u))}%</span></td><td>${fd(r.d)}</td><td>${r.h.length}</td></tr>`).join('')}</table></div>
  <p class="sm">Ordenado das piores para as melhores. Clique em uma loja para ver a evolução.</p>
  <h2>Ranking de promotores (média de todas as auditorias)</h2><div class="wrap"><table><tr><th>Promotor</th><th>Auditorias</th><th>Lojas</th><th>Média</th></tr>${pr.map(x=>`<tr><td><b>${esc(x.n)}</b></td><td>${x.a}</td><td>${x.l}</td><td><span class="tag" style="background:${cor(x.m)}">${r1(x.m)}%</span></td></tr>`).join('')}</table></div>`;
}
function chart(h){
  const W=640,H=180,P=30,n=h.length,x=i=>n==1?W/2:P+i*(W-2*P)/(n-1),y=v=>H-P-v*(H-2*P)/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ch">`;
  [0,50,100].forEach(v=>s+=`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="0" y="${y(v)+4}" font-size="10" fill="#94a3b8">${v}%</text>`);
  s+=`<polyline fill="none" stroke="#2563eb" stroke-width="3" points="${h.map((r,i)=>x(i)+','+y(pc(r))).join(' ')}"/>`;
  h.forEach((r,i)=>s+=`<circle cx="${x(i)}" cy="${y(pc(r))}" r="5" fill="${cor(pc(r))}"><title>${dt(r.ts)}: ${r1(pc(r))}%</title></circle><text x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#64748b">${dt(r.ts).slice(0,5)}</text>`);
  return s+'</svg>';
}
function vLoja(){
  const L=lojas(),ks=Object.keys(L);if(!L[sel])sel=ks[0];
  const h=L[sel],u=h.at(-1),p=h.at(-2),pu=pend(u),pp=p?pend(p).map(x=>x.k):[];
  const cats=Object.keys(SEC).filter(s=>u.t&&u.t[s]&&u.t[s].max>0);
  const pendP=p?pend(p):[],res=pendP.filter(x=>!pu.some(y=>y.k===x.k)),nov=p?pu.filter(x=>!pendP.some(y=>y.k===x.k)):[];
  const g3=pu.slice(0,3).reduce((a,x)=>a+x.w,0),gan=g3&&u.max?`<div class="box act">💡 Resolver as ${Math.min(3,pu.length)} maiores pendências vale <b>+${r1(g3)} pts</b> (${r1(pc(u))}% → ${r1((u.got+g3)/u.max*100)}%).</div>`:'';
  const hc=h.slice(-6),mx={};
  hc.forEach((r,i)=>r.itens.filter(x=>!x.x).forEach(x=>{const k=x.s+'|'+x.n;(mx[k]=mx[k]||{s:x.s,n:x.n,c:[]}).c[i]=x.r===1?'✅':'❌'}));
  const nx=m=>m.c.filter(v=>v==='❌').length,mr=Object.values(mx).filter(m=>nx(m)).sort((a,b)=>nx(b)-nx(a)).slice(0,25);
  return`<select data-sel>${ks.map(k=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(L[k].at(-1).loja)}</option>`).join('')}</select>
  <h2>Evolução do score (%)</h2>${chart(h)}
  <h2>Histórico</h2><div class="wrap"><table><tr><th>Data</th><th>Promotor</th><th>Score</th><th>%</th><th>Status</th></tr>${[...h].reverse().map(r=>`<tr><td>${dt(r.ts)}</td><td>${esc(r.promotor)}</td><td>${r1(r.got)} / ${r1(r.max)}</td><td>${r1(pc(r))}%</td><td>${esc(r.status)}</td></tr>`).join('')}</table></div>
  ${cats.length?`<h2>Por categoria (última auditoria)</h2>${cats.map(s=>{const t=u.t[s],v=t.got/t.max*100;return`<div class="row"><b>${SEC[s]}</b><div class="bar"><i style="width:${v}%;background:${cor(v)}"></i></div><span>${r1(t.got)}/${r1(t.max)}</span></div>`}).join('')}`:''}
  ${p?`<h2>Mudanças desde ${dt(p.ts)}</h2><div class="box act">✅ <b>Resolvidas (${res.length}):</b> ${res.map(x=>esc(x.n)).join('; ')||'—'}</div><div class="box act r">⚠️ <b>Novas pendências (${nov.length}):</b> ${nov.map(x=>esc(x.n)).join('; ')||'—'}</div>`:''}
  <h2>Evolução por categoria (últimas ${hc.length})</h2><div class="wrap"><table><tr><th>Cat.</th>${hc.map(r=>`<th>${dt(r.ts).slice(0,5)}</th>`).join('')}</tr>${Object.keys(SEC).filter(s=>hc.some(r=>r.t&&r.t[s]&&r.t[s].max>0)).map(s=>`<tr><td><b>${SEC[s]}</b></td>${hc.map(r=>{const t=r.t&&r.t[s];return t&&t.max>0?`<td style="color:${cor(t.got/t.max*100)};font-weight:800">${r1(t.got/t.max*100)}%</td>`:'<td>—</td>'}).join('')}</tr>`).join('')}</table></div>
  ${mr.length?`<h2>Item a item (✅ feito · ❌ pendente)</h2><div class="wrap"><table><tr><th>Item</th><th>Cat.</th>${hc.map(r=>`<th>${dt(r.ts).slice(0,5)}</th>`).join('')}</tr>${mr.map(m=>`<tr><td>${esc(m.n)}</td><td>${SEC[m.s]||esc(m.s)}</td>${hc.map((_,i)=>`<td>${m.c[i]||'·'}</td>`).join('')}</tr>`).join('')}</table></div>`:''}
  <h2>Pendências da última auditoria</h2>${gan}${pu.length?`<div class="wrap"><table><tr><th>Item</th><th>Cat.</th><th>Pts perdidos</th><th></th></tr>${pu.map(x=>`<tr><td>${esc(x.n)}</td><td>${SEC[x.s]||esc(x.s)}</td><td>${x.w?r1(x.w):'—'}</td><td>${pp.includes(x.k)?'<span class="tag" style="background:#dc2626">recorrente</span>':''}</td></tr>`).join('')}</table></div>`:'<p>Nenhuma pendência. 🎉</p>'}
  ${u.legado?'<p class="sm">Relatório no formato antigo: pontos perdidos por item podem não aparecer. Relatórios novos (gerados pelo index.html atualizado) trazem o detalhe completo.</p>':''}`;
}
function vAcoes(){
  const L=lojas(),ks=Object.keys(L),U=ks.map(k=>({k,h:L[k],u:L[k].at(-1)}));
  const cat={},it={};
  U.forEach(o=>{
    Object.keys(o.u.t||{}).forEach(s=>{const t=o.u.t[s];if(t.max>0){cat[s]=cat[s]||{g:0,m:0};cat[s].g+=t.got;cat[s].m+=t.max}});
    pend(o.u).forEach(x=>{const e=it[x.k]=it[x.k]||{n:x.n,s:x.s,l:new Set(),w:0};e.l.add(o.k);e.w+=x.w});
  });
  const top=Object.values(it).sort((a,b)=>b.w-a.w||b.l.size-a.l.size).slice(0,10);
  const cs=Object.keys(cat).map(s=>({s,v:cat[s].g/cat[s].m*100})).sort((a,b)=>a.v-b.v);
  const crit=U.filter(o=>pc(o.u)<65).sort((a,b)=>pc(a.u)-pc(b.u)),queda=U.filter(o=>dlt(o.h)!=null&&dlt(o.h)<-3);
  const cron=U.map(o=>{const p=o.h.at(-2);if(!p)return null;const a=pend(p).map(x=>x.k),r=pend(o.u).filter(x=>a.includes(x.k));return r.length?{o,r}:null}).filter(Boolean);
  const A=[];
  if(top[0])A.push(['',`<b>Maior impacto na rede:</b> “${esc(top[0].n)}” — pendente em ${top[0].l.size} de ${U.length} loja(s)${top[0].w?`, ${r1(top[0].w)} pts perdidos`:''}. Priorize ação de rede (comunicação, material, negociação).`]);
  if(cs.length)A.push(['',`<b>Categoria mais fraca:</b> ${SEC[cs[0].s]||esc(cs[0].s)} com ${r1(cs[0].v)}% de atingimento${cs[1]?`; depois ${SEC[cs[1].s]||esc(cs[1].s)} (${r1(cs[1].v)}%)`:''}.`]);
  if(crit.length)A.push(['r',`<b>Lojas críticas (abaixo de 65%):</b> ${crit.map(o=>esc(o.u.loja)+' ('+r1(pc(o.u))+'%)').join(', ')}. Visita de acompanhamento prioritária.`]);
  if(queda.length)A.push(['y',`<b>Lojas em queda:</b> ${queda.map(o=>esc(o.u.loja)+' (▼ '+r1(Math.abs(dlt(o.h)))+' p.p.)').join(', ')}. Investigue o que mudou desde a última auditoria.`]);
  cron.forEach(c=>A.push(['y',`<b>${esc(c.o.u.loja)}:</b> pendência repetida em 2 auditorias seguidas — ${c.r.slice(0,3).map(x=>esc(x.n)).join('; ')}. Problema recorrente, exige tratativa específica.`]));
  return`<h2>Direcionamento</h2>${A.length?A.map(a=>`<div class="box act ${a[0]}">${a[1]}</div>`).join(''):'<p>Sem alertas.</p>'}
  <h2>Plano de ação por loja (críticas e em queda)</h2>${[...new Set([...crit,...queda])].map(o=>{const q=pend(o.u).slice(0,3),g=q.reduce((a,x)=>a+x.w,0);return`<div class="box"><b>${esc(o.u.loja)}</b> — ${r1(pc(o.u))}%${g&&o.u.max?` → potencial ${r1((o.u.got+g)/o.u.max*100)}% (+${r1(g)} pts)`:''}<br>${q.map(x=>'• '+esc(x.n)+(x.w?' (+'+r1(x.w)+' pts)':'')).join('<br>')||'—'}</div>`}).join('')||'<p class="sm">Nenhuma loja crítica ou em queda.</p>'}
  <h2>Atingimento por categoria (rede)</h2>${cs.map(c=>`<div class="row"><b>${SEC[c.s]||esc(c.s)}</b><div class="bar"><i style="width:${c.v}%;background:${cor(c.v)}"></i></div><span>${r1(c.v)}%</span></div>`).join('')||'<p class="sm">Sem dados por categoria.</p>'}
  <h2>Top 10 pendências da rede (última auditoria de cada loja)</h2><div class="wrap"><table><tr><th>Item</th><th>Cat.</th><th>Lojas</th><th>Pts perdidos</th></tr>${top.map(x=>`<tr><td>${esc(x.n)}</td><td>${SEC[x.s]||esc(x.s)}</td><td>${x.l.size}/${U.length}</td><td>${x.w?r1(x.w):'—'}</td></tr>`).join('')}</table></div>`;
}
// ---------- PAINEL EXECUTIVO ----------
// Grupos de canal (edite aqui se mudar a composição)
const GR={'C&C + CLUB':['C&C','CLUB'],'DPP + PERF':['DPP','PERF'],'NMR + GMR + LASA + HFS + HSM':['NMR','GMR','LASA','HFS','HSM']};
const GC=['#7c2d12','#2563eb','#16a34a','#64748b'],grp=c=>Object.keys(GR).find(g=>GR[g].includes(c))||'Outros';
const FUND=[['SOS','Gôndola','#b45309'],['KBDs','KBDs','#6b7280'],['PE','Ponto Extra','#1e3a8a'],['CKO','Checkout','#ca8a04']];
let PM=null,TG=null;try{TG=+localStorage.getItem('tgt')||null}catch(e){}
const mk=r=>{const d=new Date(r.ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mi=m=>{const a=m.split('-');return a[0]*12+ +a[1]};
const ML=m=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m.slice(5)-1]+'/'+m.slice(2,4);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f=n=>n==null?'—':r1(n).toLocaleString('pt-BR');
const heat=v=>v==null?'':`background:${v>=95?'#bbf7d0':v>=80?'#dcfce7':v>=65?'#fef9c3':'#fee2e2'}`;
const hp=v=>v==null?'':`background:${v>=85?'#dcfce7':v>=60?'#fef9c3':'#fee2e2'}`;
const tc=(r,s)=>r.t&&r.t[s]?r.t[s].got:null,cp=(r,s)=>r.t&&r.t[s]&&r.t[s].max>0?r.t[s].got/r.t[s].max*100:null;
function mline(L,S){
  const W=640,H=210,P=34,n=L.length,vs=S.flatMap(s=>s.v).filter(v=>v!=null);if(!vs.length)return'';
  let lo=Math.min(...vs),hi=Math.max(...vs);const pad=(hi-lo||10)*.2;lo=Math.max(0,lo-pad);hi+=pad;
  const x=i=>n==1?W/2:P+i*(W-2*P)/(n-1),y=v=>H-24-(v-lo)*(H-40)/(hi-lo);
  let o=`<svg viewBox="0 0 ${W} ${H}" class="ch">`;
  S.forEach(s=>{
    const pt=s.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean),ps=pt.map(q=>q.join(',')).join(' ');
    if(S.length==1&&pt.length>1)o+=`<polygon fill="${s.c}22" points="${ps} ${pt.at(-1)[0]},${H-24} ${pt[0][0]},${H-24}"/>`;
    o+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${ps}"/>`;
    s.v.forEach((v,i)=>{if(v!=null)o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.c}"><title>${s.n} ${L[i]}: ${r1(v)}</title></circle><text x="${x(i)}" y="${y(v)-8}" font-size="9" font-weight="700" text-anchor="middle" fill="${s.c}">${r1(v)}</text>`});
  });
  L.forEach((l,i)=>o+=`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#64748b">${l}</text>`);
  return o+'</svg>'+(S.length>1?`<div class="sm">${S.map(s=>`<b style="color:${s.c}">● ${esc(s.n)}</b>`).join(' &nbsp; ')}</div>`:'');
}
function vPainel(){
  const M={};view().sort((a,b)=>a.ts<b.ts?-1:1).forEach(r=>{(M[mk(r)]=M[mk(r)]||{})[nk(r.loja)]=r});
  const ms=Object.keys(M).sort(),cur=ms.includes(PM)?PM:ms.at(-1),R=Object.values(M[cur]),last=ms.slice(-12),LB=last.map(ML);
  const rs=(m,c,g)=>Object.values(M[m]).filter(r=>(!c||r.canal===c)&&(!g||grp(r.canal)===g));
  const tot=new Set(view().map(r=>nk(r.loja))).size,tgt=TG||tot,m0=avg(R.map(r=>r.got));
  const cn=[...new Set(view().map(r=>r.canal).filter(Boolean))].sort(),gs=[...new Set(view().map(r=>grp(r.canal)))];
  const td=v=>`<td style="${heat(v)}">${f(v)}</td>`,th=a=>`<tr>${a.map(x=>`<th>${x}</th>`).join('')}</tr>`;
  const tb=(h,rows,foot)=>`<div class="wrap"><table>${th(h)}${rows.join('')}${foot||''}</table></div>`;
  const win=R0=>{const w={};view().filter(r=>{const d=mi(mk(r))-mi(cur);return d<=0&&d>=-2}).sort((a,b)=>a.ts<b.ts?-1:1).forEach(r=>w[nk(r.loja)]=r);return Object.values(w)};
  const W3=win(),srt=a=>[...a].sort((x,y)=>y.got-x.got);
  const catc=(r,fn)=>FUND.slice().sort((a,b)=>'PE,CKO,SOS,KBDs'.indexOf(a[0])-'PE,CKO,SOS,KBDs'.indexOf(b[0])).map(c=>fn(r,c[0]));
  const HD=['Ponto Extra','Checkout','Gôndola','KBDs'],cs=['PE','CKO','SOS','KBDs'];
  const ft=(lbl,a,fn)=>`<tr style="font-weight:800;background:#f1f5f9"><td colspan="2">${lbl}</td>${fn(a)}</tr>`;
  return`<div class="k" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
   <div><span>Lojas lidas em</span><br><select data-pm="1">${ms.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${ML(m)}</option>`).join('')}</select> <b style="color:${cor(R.length/tgt*100)}">${Math.round(R.length/tgt*100)}%</b></div>
   <div><span># Target lojas (editável)</span><br><input type="number" min="1" data-tg="1" value="${tgt}" style="width:90px;padding:6px"></div>
   <div><b>${R.length}</b><span># Lojas lidas</span></div>
   <div><b style="color:${cor(m0)}">${f(m0)}</b><span>Média pontuação</span><div class="bar"><i style="width:${Math.min(100,m0)}%;background:${cor(m0)}"></i></div></div></div>
  <h2>Evolução histórica da média de pontuação total</h2>${mline(LB,[{n:'Total',c:'#16a34a',v:last.map(m=>avg(rs(m).map(r=>r.got)))}])}
  <h2>Evolução da média de pontuação dos fundamentos</h2>${mline(LB,FUND.map(c=>({n:c[1],c:c[2],v:last.map(m=>avg(rs(m).map(r=>tc(r,c[0])).filter(v=>v!=null)))})))}
  <h2>Média de pontuação por canal</h2>${tb(['Canal',...LB,'Total'],cn.map(c=>`<tr><td><b>${esc(c)}</b></td>${last.map(m=>td(avg(rs(m,c).map(r=>r.got)))).join('')}${td(avg(last.flatMap(m=>rs(m,c).map(r=>r.got))))}</tr>`),`<tr style="font-weight:800"><td>Total</td>${last.map(m=>td(avg(rs(m).map(r=>r.got)))).join('')}${td(avg(last.flatMap(m=>rs(m).map(r=>r.got))))}</tr>`)}
  <h2>Lojas perfeitas por canal em ${ML(cur)} (&gt; 95 pts)</h2>${tb(['Canal','Lojas lidas','Perfeitas','% perfeitas','Média'],cn.map(c=>{const a=R.filter(r=>r.canal===c);return a.length?`<tr><td><b>${esc(c)}</b></td><td>${a.length}</td><td>${a.filter(r=>r.got>95).length}</td><td>${Math.round(a.filter(r=>r.got>95).length/a.length*100)}%</td>${td(avg(a.map(r=>r.got)))}</tr>`:''}),`<tr style="font-weight:800"><td>Total</td><td>${R.length}</td><td>${R.filter(r=>r.got>95).length}</td><td>${Math.round(R.filter(r=>r.got>95).length/R.length*100)}%</td>${td(m0)}</tr>`)}
  <h2>Evolução da média por grupo de canal</h2>${mline(LB,gs.map((g,i)=>({n:g,c:GC[i%4],v:last.map(m=>avg(rs(m,null,g).map(r=>r.got)))})))}
  ${tb([...gs,'Total'].map(esc),[`<tr>${gs.map(g=>td(avg(rs(cur,null,g).map(r=>r.got)))).join('')}${td(m0)}</tr>`])}
  <h2>Programa de Lojas Perfeitas — pontuação por loja em ${ML(cur)}</h2>${tb(['Loja','Canal','Total',...HD],srt(R).map(r=>`<tr><td><b>${esc(r.loja)}</b></td><td>${esc(r.canal)}</td><td style="${heat(r.got)};font-weight:800">${f(r.got)}</td>${cs.map(c=>`<td>${f(tc(r,c))}</td>`).join('')}</tr>`),`<tr style="font-weight:800;background:#f1f5f9"><td colspan="2">Média</td><td>${f(m0)}</td>${cs.map(c=>`<td>${f(avg(R.map(r=>tc(r,c)).filter(v=>v!=null)))}</td>`).join('')}</tr>`)}
  <h2>Compliance score por loja em ${ML(cur)} (% do máximo)</h2>${tb(['Loja','Canal','Compliance',...HD],srt(R).map(r=>`<tr><td><b>${esc(r.loja)}</b></td><td>${esc(r.canal)}</td><td style="${hp(r.max?r.got/r.max*100:null)};font-weight:800">${r.max?Math.round(r.got/r.max*100)+'%':'—'}</td>${cs.map(c=>{const v=cp(r,c);return`<td style="${hp(v)}">${v==null?'—':Math.round(v)+'%'}</td>`}).join('')}</tr>`),`<tr style="font-weight:800;background:#f1f5f9"><td colspan="2">Total</td><td>${Math.round(R.reduce((a,r)=>a+r.got,0)/(R.reduce((a,r)=>a+(r.max||0),0)||1)*100)}%</td>${cs.map(c=>{const a=R.filter(r=>cp(r,c)!=null);const m=a.reduce((x,r)=>x+r.t[c].max,0);return`<td>${m?Math.round(a.reduce((x,r)=>x+r.t[c].got,0)/m*100)+'%':'—'}</td>`}).join('')}</tr>`)}
  <h2>Pontuação média SIMULADA (último resultado nos últimos 3 meses até ${ML(cur)})</h2>${tb(['Loja','Canal','Total',...HD],srt(W3).map(r=>`<tr><td><b>${esc(r.loja)}</b><br><span class="sm">${dt(r.ts)}</span></td><td>${esc(r.canal)}</td><td style="${heat(r.got)};font-weight:800">${f(r.got)}</td>${cs.map(c=>`<td>${f(tc(r,c))}</td>`).join('')}</tr>`),`<tr style="font-weight:800;background:#f1f5f9"><td colspan="2">Média (${W3.length} lojas)</td><td>${f(avg(W3.map(r=>r.got)))}</td>${cs.map(c=>`<td>${f(avg(W3.map(r=>tc(r,c)).filter(v=>v!=null)))}</td>`).join('')}</tr>`)}
  <p class="sm">Cada loja conta pela sua última auditoria do mês. Os grupos de canal podem ser ajustados no começo do bloco “PAINEL EXECUTIVO” do código.</p>`;
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#v').innerHTML=DB.length?fbar()+(view().length?(tab==='geral'?vGeral():tab==='painel'?vPainel():tab==='loja'?vLoja():vAcoes()):'<div class="empty">Nenhuma auditoria neste filtro.</div>'):'<div class="empty"><h2>Nenhum relatório carregado</h2>Clique em “Carregar relatórios” (ou arraste os arquivos) e selecione os relatórios .html baixados da ferramenta de auditoria.<br>As lojas e a evolução ficam salvas neste navegador.</div>';
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-csv]')){csv();return}
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  const k=e.target.closest('[data-k]');if(k){sel=k.dataset.k;tab='loja';render()}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-sel]')){sel=e.target.value;render()}else if(e.target.dataset.pm){PM=e.target.value;render()}else if(e.target.dataset.tg){TG=+e.target.value||null;try{localStorage.setItem('tgt',TG||'')}catch(x){}render()}else if(e.target.dataset.f){F[e.target.dataset.f]=e.target.value;render()}});
$('#f').onchange=e=>{ingest(e.target.files);e.target.value=''};
$('#cl').onclick=()=>{if(confirm('Apagar todas as auditorias carregadas?')){DB=[];save();render()}};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='base_auditorias.json';a.click()};
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();$('#drop').style.display=n==='dragover'?'flex':'none';if(n==='drop')ingest(e.dataTransfer.files)}));
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#drop').style.display='none'});
const CFG=()=>{try{return JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){return{}}};
async function sync(auto){
  let c=CFG();
  if(!c.u||!c.k){
    if(auto)return;
    c.u=(prompt('Cole o link do script da planilha (termina em /exec):',c.u||'')||'').trim();if(!c.u)return;
    c.k=(prompt('Chave de LEITURA:',c.k||'')||'').trim();if(!c.k)return;
    try{localStorage.setItem('cfg',JSON.stringify(c))}catch(e){}
  }
  try{
    const r=await fetch(c.u+(c.u.includes('?')?'&':'?')+'chave='+encodeURIComponent(c.k)),j=await r.json();
    if(!j.ok)throw new Error(j.erro||'resposta inválida');
    let n=0;j.dados.forEach(x=>{if(x&&x.loja&&x.ts&&add(x))n++});save();render();
    if(!auto)alert(n+' auditoria(s) nova(s) da planilha. Total na base: '+DB.length+'.');
  }catch(e){if(!auto)alert('Falha ao sincronizar: '+e.message)}
}
$('#sy').onclick=()=>sync();
$('#cf').onclick=()=>{try{localStorage.removeItem('cfg')}catch(e){}sync()};
addEventListener('load',()=>sync(true));
let DP;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(DP){DP.prompt();await DP.userChoice;DP=null;$('#inst').hidden=true}};
addEventListener('appinstalled',()=>{$('#inst').hidden=true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
